[project]
name = "proyecto-final-clasificacion-materiales"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mariana Rada", email = "mariana.radaespitia08@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
proyecto-final-clasificacion-materiales = "proyecto_final_clasificacion_materiales:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
